name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Noo aims to be a simple, just-works Nextcloud client with reasonable
        customization, not a replacement for every Nextcloud feature. Requests
        that fit that goal are most likely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
