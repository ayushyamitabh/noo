name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Noo version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Nextcloud server version
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Remove any personal data or server addresses you don't want public.
