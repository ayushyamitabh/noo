name: Android RC to Google Play (internal)

# Deliberately not "on every push" - only when an Android release-candidate
# tag (RC-Android-1, RC-Android-2, ...) is pushed. Tag the commit you want built:
#   git tag RC-Android-1 && git push origin RC-Android-1
# Builds the .aab Play wants (no sideloadable .apk) and uploads it straight to
# the internal testing track. iOS has its own RC-iOS-* tags (ios.yml);
# Release-* builds both platforms.
on:
  push:
    tags:
      - "RC-Android-*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy standalone "tools" package from the
          # SDK repository (~Sep 2026); the action's own default packages
          # list ("tools platform-tools") now makes its internal sdkmanager
          # call fail for everyone. platform-tools is all this step needs
          # to install itself - flutter build fetches whatever
          # platform/build-tools versions it actually needs on its own.
          packages: "platform-tools"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Decode release keystore
        # Keeps every release build - regardless of which runner built it -
        # signed with the same key, matching what Play already has on file
        # for the app. See android/app/build.gradle.kts.
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release-keystore.jks"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build release App Bundle
        run: flutter build appbundle --release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Read version from pubspec
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload to Google Play (internal track)
        # Needs the PLAY_SERVICE_ACCOUNT_JSON repo secret, and the app's
        # first release must already have been uploaded by hand. Play
        # rejects a repeated versionCode, so bump the `+N` build number in
        # pubspec.yaml before tagging each new RC.
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.ayushya.noo
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.VERSION }} (${{ github.ref_name }})
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
